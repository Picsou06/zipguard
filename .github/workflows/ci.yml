name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zipguard.app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zipguard.app/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: zipguard.app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: zipguard.app/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[7z]" -r requirements-dev.txt

      - name: Run tests
        run: pytest -q --cov=zipguard --cov-report=term --cov-fail-under=85

      - name: Coverage summary
        if: matrix.python-version == '3.12'
        run: |
          echo "## Couverture des tests" >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage json -o coverage.json

      - name: Keep the coverage figure
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: zipguard.app/coverage.json

      - name: Run the guard bench
        run: zipguard bench --repeat 1 --json

  # Le badge de couverture vit dans une branche à part, réécrite à chaque passage sur main :
  # aucun service externe, et l'historique de main ne se remplit pas de commits de robot.
  badge:
    name: Coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: coverage

      - name: Publish the badge to the badges branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          percent=$(python3 -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          if [ "$percent" -ge 90 ]; then color=brightgreen
          elif [ "$percent" -ge 80 ]; then color=green
          elif [ "$percent" -ge 70 ]; then color=yellow
          else color=red; fi

          mkdir badge && cd badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$percent" "$color" > coverage.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "Couverture : ${percent} %"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t zipguard:ci ./zipguard.app

      - name: Smoke test
        run: |
          docker run --rm zipguard:ci --help
          docker run --rm zipguard:ci formats
          docker run --rm zipguard:ci bench --repeat 1 --json
