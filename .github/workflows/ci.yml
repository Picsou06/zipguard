name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Style
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zipguard.app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: zipguard.app/requirements-dev.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: zipguard.app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: zipguard.app/requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[7z]" -r requirements-dev.txt

      - name: Run tests
        run: pytest -q

      - name: Run the guard bench
        run: zipguard bench --repeat 1 --json

  docker:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t zipguard:ci ./zipguard.app

      - name: Smoke test
        run: |
          docker run --rm zipguard:ci --help
          docker run --rm zipguard:ci formats
          docker run --rm zipguard:ci bench --repeat 1 --json
