name: Release

# Publie sur PyPI à chaque étiquette vX.Y.Z, par publication de confiance (OIDC) :
# aucun jeton à stocker dans les secrets du dépôt. À configurer une fois côté PyPI,
# voir la section « Publier une version » du README.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zipguard.app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "L'étiquette ${GITHUB_REF_NAME} ne correspond pas à la version ${version}." >&2
            exit 1
          }

      - name: Test
        run: |
          pip install ".[7z]" -r requirements-dev.txt
          pytest -q

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: zipguard.app/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
