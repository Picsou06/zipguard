name: ZipGuard
description: Repère les bombes de décompression d'un dépôt et publie les refus dans l'onglet Sécurité.
author: Evan D et Hamza Karrouchi

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Dossier ou archive à inspecter. Un dossier est parcouru, chaque archive reconnue par sa signature est inspectée.
    required: false
    default: "."
  sarif-file:
    description: Chemin du rapport SARIF produit.
    required: false
    default: zipguard.sarif
  upload:
    description: Publie le rapport dans l'onglet Sécurité (exige la permission security-events write).
    required: false
    default: "true"
  fail-on-findings:
    description: Fait échouer le job si une archive est jugée dangereuse.
    required: false
    default: "false"
  trust:
    description: Liste d'empreintes SHA-256 de confiance, au format de sha256sum.
    required: false
    default: ""
  args:
    description: Options supplémentaires passées à zipguard scan, par exemple --max-ratio 50.
    required: false
    default: ""
  python-version:
    description: Version de Python utilisée pour lancer ZipGuard.
    required: false
    default: "3.12"

outputs:
  findings:
    description: Nombre de refus dans le rapport.
    value: ${{ steps.scan.outputs.findings }}
  unsafe:
    description: true si au moins une archive est jugée dangereuse.
    value: ${{ steps.scan.outputs.unsafe }}
  sarif-file:
    description: Chemin du rapport SARIF produit.
    value: ${{ inputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # ZipGuard est installé depuis l'action elle même : la version qui tourne est exactement
    # celle de l'étiquette demandée dans uses:, sans dépendre de PyPI.
    - name: Install ZipGuard
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: python -m pip install --quiet --disable-pip-version-check "${ACTION_PATH}/zipguard.app[7z]"

    # Les entrées passent par l'environnement, jamais par interpolation dans le script :
    # une valeur contenant $(...) ou un guillemet reste une valeur, pas une commande.
    - name: Scan
      id: scan
      shell: bash
      env:
        ZG_PATH: ${{ inputs.path }}
        ZG_SARIF: ${{ inputs.sarif-file }}
        ZG_TRUST: ${{ inputs.trust }}
        ZG_ARGS: ${{ inputs.args }}
      run: |
        set -uo pipefail
        options=()
        if [ -n "$ZG_TRUST" ]; then options+=(--trust "$ZG_TRUST"); fi
        read -r -a extra <<< "$ZG_ARGS"
        # La forme ${tableau[@]+...} évite l'erreur « unbound variable » de bash 3 (macOS)
        # quand le tableau est vide sous set -u.
        # GitHub lance ce script avec bash -e : le code 1 (archive dangereuse) l'arrêterait
        # avant d'écrire les sorties. On le recueille donc sans laisser -e réagir.
        status=0
        zipguard scan "$ZG_PATH" --sarif ${options[@]+"${options[@]}"} ${extra[@]+"${extra[@]}"} > "$ZG_SARIF" || status=$?
        if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
          echo "::error::zipguard a échoué (code $status)."
          exit "$status"
        fi
        findings=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))['runs'][0]['results']))" "$ZG_SARIF")
        echo "findings=$findings" >> "$GITHUB_OUTPUT"
        if [ "$status" -eq 1 ]; then echo "unsafe=true" >> "$GITHUB_OUTPUT"; else echo "unsafe=false" >> "$GITHUB_OUTPUT"; fi
        {
          echo "## ZipGuard"
          echo
          if [ "$status" -eq 1 ]; then
            echo "⛔ $findings refus. Détail dans l'onglet Sécurité ou dans \`$ZG_SARIF\`."
          else
            echo "✅ Aucune archive dangereuse."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload SARIF
      if: inputs.upload == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: zipguard

    - name: Fail on findings
      if: inputs.fail-on-findings == 'true' && steps.scan.outputs.unsafe == 'true'
      shell: bash
      run: |
        echo "::error::ZipGuard a jugé au moins une archive dangereuse."
        exit 1
