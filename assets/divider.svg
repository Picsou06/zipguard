<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="presentation">
	<defs>
		<linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
			<stop offset="0" stop-color="#7F7FD5"/>
			<stop offset="0.5" stop-color="#86A8E7"/>
			<stop offset="1" stop-color="#91EAE4"/>
			<animateTransform attributeName="gradientTransform" type="translate"
				values="-1 0;1 0;-1 0" dur="4s" repeatCount="indefinite"/>
		</linearGradient>
	</defs>

	<rect x="0" y="10" width="900" height="4" rx="2" fill="url(#flow)"/>

	<circle cy="12" r="5" fill="#ffffff" stroke="#86A8E7" stroke-width="2">
		<animate attributeName="cx" values="0;900" dur="3.2s" repeatCount="indefinite"/>
	</circle>
	<circle cy="12" r="3" fill="#91EAE4">
		<animate attributeName="cx" values="900;0" dur="3.8s" repeatCount="indefinite"/>
	</circle>
</svg>
